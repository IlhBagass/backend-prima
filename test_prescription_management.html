<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prescription Tester</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --panel: #111a33;
        --muted: #9aa7c7;
        --text: #e9eeff;
        --border: rgba(255, 255, 255, 0.12);
        --accent: #6ea8fe;
        --danger: #ff6b6b;
        --ok: #51cf66;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(1200px 700px at 20% -10%, #1c2b5a, var(--bg));
        color: var(--text);
      }

      header {
        padding: 20px 16px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        backdrop-filter: blur(10px);
        background: rgba(11, 16, 32, 0.75);
        z-index: 10;
      }

      header h1 {
        margin: 0 0 6px 0;
        font-size: 18px;
      }

      input[type="text"],
      textarea {
        width: 100%;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        outline: none;
      }

      textarea {
        min-height: 140px;
        font-family: var(--mono);
        font-size: 12px;
      }

      .wrap {
        padding: 16px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 12px;
        align-items: start;
      }

      .card {
        grid-column: span 12;
        background: rgba(17, 26, 51, 0.72);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
      }

      @media (min-width: 900px) {
        .col-6 {
          grid-column: span 6;
        }
      }

      .card h2 {
        font-size: 14px;
        margin: 0 0 8px 0;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      button {
        cursor: pointer;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 10px;
        font-weight: 600;
      }

      button.primary {
        border-color: rgba(110, 168, 254, 0.35);
        background: rgba(110, 168, 254, 0.12);
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .row > * {
        flex: 1;
        min-width: 180px;
      }

      pre {
        margin: 0;
        padding: 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border);
        overflow: auto;
        font-family: var(--mono);
        font-size: 12px;
      }

      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        margin-left: 8px;
      }

      .status.ok {
        color: var(--ok);
      }
      .status.bad {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Test Prescription Module</h1>
        <div class="row">
          <div style="min-width: 260px; flex: 2">
            <label class="muted">Base URL</label>
            <input id="baseUrl" type="text" value="http://localhost:3000" />
          </div>
          <div style="min-width: 260px; flex: 2">
            <label class="muted">Prefix Prescription</label>
            <input id="prescriptionPrefix" type="text" value="/prescription" />
          </div>
          <div style="min-width: 260px; flex: 2">
            <label class="muted">Status</label>
            <div id="statusLine" class="muted">Ready</div>
          </div>
          <div style="min-width: 160px; flex: 1; align-self: end">
            <button class="primary" id="pingBtn">Ping /</button>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="grid">
        <section class="card col-6">
          <h2>Create Prescription <span class="pill">POST /prescription/create</span></h2>
          <div class="row">
            <div>
              <label class="muted">patient_id</label>
              <input id="createPatientId" type="text" placeholder="ID patient" />
            </div>
            <div>
              <label class="muted">doctor_id</label>
              <input id="createDoctorId" type="text" placeholder="ID doctor" />
            </div>
            <div>
              <label class="muted">booking_id</label>
              <input id="createBookingId" type="text" placeholder="ID booking (optional)" />
            </div>
          </div>
          <div class="row" style="margin-top: 8px;">
            <div>
              <label class="muted">notes</label>
              <textarea id="createNotes" placeholder="Catatan resep..."></textarea>
            </div>
          </div>
          <div style="margin-top: 10px" class="row">
            <button class="primary" id="createBtn">Create</button>
            <button id="loadCreateExampleBtn">Load Example</button>
          </div>
        </section>

        <section class="card col-6">
          <h2>Get Prescription <span class="pill">GET /prescription/show/:id</span></h2>
          <div class="row">
            <div>
              <label class="muted">Prescription ID</label>
              <input id="getPrescriptionId" type="text" placeholder="UUID prescription" />
            </div>
          </div>
          <div style="margin-top: 10px" class="row">
            <button class="primary" id="getBtn">GET</button>
          </div>
        </section>

        <section class="card col-6">
          <h2>Update Prescription <span class="pill">PUT /prescription/update/:id</span></h2>
          <div class="row">
            <div>
              <label class="muted">Prescription ID</label>
              <input id="updatePrescriptionId" type="text" placeholder="UUID prescription" />
            </div>
          </div>
          <div class="row" style="margin-top: 8px;">
            <div>
              <label class="muted">notes</label>
              <textarea id="updateNotes" placeholder="Update catatan resep..."></textarea>
            </div>
          </div>
          <div style="margin-top: 10px" class="row">
            <button class="primary" id="updateBtn">UPDATE</button>
          </div>
        </section>

        <section class="card col-6">
          <h2>Delete Prescription <span class="pill">DELETE /prescription/delete/:id</span></h2>
          <div class="row">
            <div>
              <label class="muted">Prescription ID</label>
              <input id="deletePrescriptionId" type="text" placeholder="UUID prescription" />
            </div>
          </div>
          <div style="margin-top: 10px" class="row">
            <button class="primary" id="deleteBtn">DELETE</button>
          </div>
        </section>

        <section class="card col-12">
          <h2>Response Log</h2>
          <pre id="log"></pre>
        </section>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      const statusLine = $("statusLine");

      const setStatus = (text, ok = true) => {
        statusLine.textContent = text;
        statusLine.className = ok ? "muted status ok" : "muted status bad";
      };

      const buildUrl = (path) => {
        const base = $("baseUrl").value.trim().replace(/\/+$/, "");
        return `${base}${path.startsWith("/") ? "" : "/"}${path}`;
      };

      const writeLog = (payload) => {
        logEl.textContent = typeof payload === "string" ? payload : JSON.stringify(payload, null, 2);
      };

      const safeJsonParse = (raw) => {
        try {
          return { ok: true, value: JSON.parse(raw) };
        } catch (e) {
          return { ok: false, error: e.message };
        }
      };

      const requestJson = async ({ method, path, body }) => {
        const url = buildUrl(path);
        setStatus(`${method} ${url} ...`);

        const headers = {};
        if (body !== undefined) headers["content-type"] = "application/json";

        const res = await fetch(url, {
          method,
          headers,
          body: body !== undefined ? JSON.stringify(body) : undefined,
        });

        const text = await res.text();
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }

        writeLog({ status: res.status, ok: res.ok, url, data });
        setStatus(`${method} ${url} -> ${res.status}`, res.ok);
        return { res, data };
      };

      $("pingBtn").addEventListener("click", async () => {
        await requestJson({ method: "GET", path: "/" });
      });

      $("loadCreateExampleBtn").addEventListener("click", () => {
        $("createPatientId").value = "064a2e03-98ee-4d9e-ac90-a17a499a0252";
        $("createDoctorId").value = "a41342c8-6f07-4009-bf3e-6978f1f6c934";
        $("createBookingId").value = "BOOK001";
        $("createNotes").value = "Paracetamol 500mg 3x sehari setelah makan. Minum banyak air. Kontrol 1 minggu lagi.";
      });

      $("createBtn").addEventListener("click", async () => {
        const prefix = $("prescriptionPrefix").value.trim() || "/prescription";
        const body = {
          patient_id: $("createPatientId").value.trim(),
          doctor_id: $("createDoctorId").value.trim(),
          booking_id: $("createBookingId").value.trim() || null,
          notes: $("createNotes").value.trim(),
        };
        if (!body.patient_id || !body.doctor_id || !body.notes) {
          return writeLog({ error: "patient_id, doctor_id, dan notes wajib diisi" });
        }
        await requestJson({ method: "POST", path: `${prefix}/create`, body });
      });

      $("getBtn").addEventListener("click", async () => {
        const prefix = $("prescriptionPrefix").value.trim() || "/prescription";
        const id = $("getPrescriptionId").value.trim();
        if (!id) return writeLog({ error: "Prescription ID wajib diisi" });
        await requestJson({ method: "GET", path: `${prefix}/show/${encodeURIComponent(id)}` });
      });

      $("updateBtn").addEventListener("click", async () => {
        const prefix = $("prescriptionPrefix").value.trim() || "/prescription";
        const id = $("updatePrescriptionId").value.trim();
        if (!id) return writeLog({ error: "Prescription ID wajib diisi" });
        const notes = $("updateNotes").value.trim();
        if (!notes) return writeLog({ error: "notes wajib diisi untuk update" });
        await requestJson({ method: "PUT", path: `${prefix}/update/${encodeURIComponent(id)}`, body: { notes } });
      });

      $("deleteBtn").addEventListener("click", async () => {
        const prefix = $("prescriptionPrefix").value.trim() || "/prescription";
        const id = $("deletePrescriptionId").value.trim();
        if (!id) return writeLog({ error: "Prescription ID wajib diisi" });
        if (!confirm(`Hapus prescription ${id}?`)) return;
        await requestJson({ method: "DELETE", path: `${prefix}/delete/${encodeURIComponent(id)}` });
      });
    </script>
  </body>
</html>
