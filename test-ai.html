<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Test AI RAG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .result {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #eee;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Test AI RAG</h2>

  <textarea id="question" placeholder="Tanyakan sesuatu..."></textarea>
  <button onclick="askAI()">Kirim</button>

  <div class="result" id="result"></div>
</div>

<script>
    async function askAI() {
    const question = document.getElementById("question").value;
    const resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "Loading...";

    try {
        const res = await fetch("https://backend-prima.vercel.app/ai/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ question })
        });

        const data = await res.json();

        const ai = data.data;

        resultDiv.innerHTML = `
    === JAWABAN ===
    ${ai.user_message}

    === KONDISI ===
    ${ai.possible_conditions.map(c => `- ${c.name} (${c.likelihood})`).join("\n")}

    === YANG BISA DILAKUKAN ===
    ${ai.what_you_can_do_now.map(i => `- ${i}`).join("\n")}

    === KE DOKTER JIKA ===
    ${ai.when_to_see_doctor.map(i => `- ${i}`).join("\n")}

    === CEK LANJUT ===
    ${ai.recommended_checks.map(i => `- ${i}`).join("\n")}

    === INSIGHT ===
    ${ai.health_insight.title}
    ${ai.health_insight.description}

    === WHO DATA ===
    ${ai.who_context.indicator}:
    ${ai.who_context.value} ${ai.who_context.unit} (${ai.who_context.year})

    === DISCLAIMER ===
    ${ai.disclaimer}

    === SOURCES ===
    ${(data.sources || []).join("\n---\n")}
    `;

    } catch (err) {
        resultDiv.innerHTML = "Error: " + err.message;
    }
    }
</script>

</body>
</html>
