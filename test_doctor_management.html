<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doctor Management Tester</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --panel: #111a33;
        --muted: #9aa7c7;
        --text: #e9eeff;
        --border: rgba(255, 255, 255, 0.12);
        --accent: #6ea8fe;
        --danger: #ff6b6b;
        --ok: #51cf66;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(1200px 700px at 20% -10%, #1c2b5a, var(--bg));
        color: var(--text);
      }

      header {
        padding: 20px 16px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        backdrop-filter: blur(10px);
        background: rgba(11, 16, 32, 0.75);
        z-index: 10;
      }

      header h1 {
        margin: 0 0 6px 0;
        font-size: 18px;
      }

      header .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        outline: none;
      }

      textarea {
        min-height: 130px;
        font-family: var(--mono);
        font-size: 12px;
      }

      .wrap {
        padding: 16px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 12px;
        align-items: start;
      }

      .card {
        grid-column: span 12;
        background: rgba(17, 26, 51, 0.72);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
      }

      @media (min-width: 900px) {
        .col-6 {
          grid-column: span 6;
        }
      }

      .card h2 {
        font-size: 14px;
        margin: 0 0 8px 0;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      button {
        cursor: pointer;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 10px;
        font-weight: 600;
      }

      button.primary {
        border-color: rgba(110, 168, 254, 0.35);
        background: rgba(110, 168, 254, 0.12);
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .row > * {
        flex: 1;
        min-width: 180px;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      pre {
        margin: 0;
        padding: 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border);
        overflow: auto;
        font-family: var(--mono);
        font-size: 12px;
      }

      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        margin-left: 8px;
      }

      .status.ok {
        color: var(--ok);
      }
      .status.bad {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Test Doctors Module</h1>
        <div class="row">
          <div style="min-width: 260px; flex: 2">
            <label class="muted">Base URL</label>
            <input id="baseUrl" type="text" value="http://localhost:3000" />
          </div>
          <div style="min-width: 220px">
            <label class="muted">Prefix</label>
            <input id="doctorPrefix" type="text" value="/doctors" />
          </div>
          <div style="align-self: end; min-width: 180px">
            <button class="primary" id="pingBtn">Ping /</button>
          </div>
          <div style="align-self: end; min-width: 240px">
            <div class="muted status ok" id="statusLine">Ready</div>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="grid">
        <section class="card col-6">
          <h2>List Dokter <span class="pill">GET /doctors</span></h2>
          <div class="stack">
            <div class="row">
              <div>
                <label class="muted">nama</label>
                <input id="qNama" type="text" placeholder="contoh: andi" />
              </div>
              <div>
                <label class="muted">spesialisasi</label>
                <input id="qSpes" type="text" placeholder="contoh: umum" />
              </div>
            </div>
            <div class="row">
              <div>
                <label class="muted">kota</label>
                <input id="qKota" type="text" placeholder="contoh: Bandung" />
              </div>
              <div>
                <label class="muted">tersedia</label>
                <select id="qTersedia">
                  <option value="">(all)</option>
                  <option value="true">true (punya schedule)</option>
                  <option value="false">false (belum punya schedule)</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div>
                <label class="muted">limit</label>
                <input id="qLimit" type="number" value="50" min="1" max="200" />
              </div>
              <div>
                <label class="muted">offset</label>
                <input id="qOffset" type="number" value="0" min="0" />
              </div>
            </div>
            <div class="row">
              <button class="primary" id="listBtn">Fetch</button>
              <button id="useFirstIdBtn">Use first id</button>
            </div>
            <div class="muted">Catatan: <code>rating_min</code> belum didukung (belum ada tabel ulasan).</div>
          </div>
        </section>

        <section class="card col-6">
          <h2>Detail Dokter <span class="pill">GET /doctors/:id</span></h2>
          <div class="stack">
            <div class="row">
              <div>
                <label class="muted">doctor_id</label>
                <input id="doctorId" type="text" placeholder="id doctor dari list" />
              </div>
              <div style="align-self: end">
                <button class="primary" id="detailBtn">Fetch</button>
              </div>
            </div>
          </div>
        </section>

        <section class="card col-12">
          <h2>Response Log</h2>
          <pre id="log"></pre>
        </section>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      const statusLine = $("statusLine");
      let lastList = null;

      const setStatus = (text, ok = true) => {
        statusLine.textContent = text;
        statusLine.className = ok ? "muted status ok" : "muted status bad";
      };

      const writeLog = (obj) => {
        logEl.textContent = JSON.stringify(obj, null, 2);
      };

      const getBase = () => {
        const baseUrl = $("baseUrl").value.trim().replace(/\/+$/, "");
        let doctorPrefix = $("doctorPrefix").value.trim().replace(/\/+$/, "");
        if (!doctorPrefix) doctorPrefix = "/doctors";
        if (!doctorPrefix.startsWith("/")) doctorPrefix = `/${doctorPrefix}`;
        return { baseUrl, doctorPrefix };
      };

      const buildRootUrl = () => {
        const { baseUrl } = getBase();
        return `${baseUrl}/`;
      };

      const buildDoctorUrl = (path) => {
        const { baseUrl, doctorPrefix } = getBase();
        const clean = String(path || "");
        if (!clean || clean === "/") return `${baseUrl}${doctorPrefix}`;
        return `${baseUrl}${doctorPrefix}${clean.startsWith("/") ? "" : "/"}${clean}`;
      };

      const requestJson = async ({ method, url }) => {
        setStatus(`${method} ${url} ...`);
        const res = await fetch(url, { method });
        let data = null;
        const text = await res.text();
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }
        writeLog({ status: res.status, ok: res.ok, url, data });
        setStatus(`${method} ${url} -> ${res.status}`, res.ok);
        return { res, data };
      };

      $("pingBtn").addEventListener("click", async () => {
        await requestJson({ method: "GET", url: buildRootUrl() });
      });

      $("listBtn").addEventListener("click", async () => {
        const qs = new URLSearchParams();
        const nama = $("qNama").value.trim();
        const spesialisasi = $("qSpes").value.trim();
        const kota = $("qKota").value.trim();
        const tersedia = $("qTersedia").value;
        const limit = $("qLimit").value;
        const offset = $("qOffset").value;
        if (nama) qs.set("nama", nama);
        if (spesialisasi) qs.set("spesialisasi", spesialisasi);
        if (kota) qs.set("kota", kota);
        if (tersedia) qs.set("tersedia", tersedia);
        if (limit) qs.set("limit", limit);
        if (offset) qs.set("offset", offset);

        const url = buildDoctorUrl(`/?${qs.toString()}`);
        const { res, data } = await requestJson({ method: "GET", url });
        if (res.ok) lastList = data;
      });

      $("useFirstIdBtn").addEventListener("click", () => {
        const firstId = lastList?.data?.[0]?.id;
        if (!firstId) return writeLog({ error: "Belum ada hasil list atau data kosong" });
        $("doctorId").value = firstId;
        writeLog({ ok: true, message: "doctor_id terisi dari data[0].id", id: firstId });
      });

      $("detailBtn").addEventListener("click", async () => {
        const id = $("doctorId").value.trim();
        if (!id) return writeLog({ error: "doctor_id wajib diisi" });
        const url = buildDoctorUrl(`/${encodeURIComponent(id)}`);
        await requestJson({ method: "GET", url });
      });
    </script>
  </body>
</html>
