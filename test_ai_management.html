<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Module Tester</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --panel: #111a33;
        --muted: #9aa7c7;
        --text: #e9eeff;
        --border: rgba(255, 255, 255, 0.12);
        --accent: #6ea8fe;
        --danger: #ff6b6b;
        --ok: #51cf66;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(1200px 700px at 20% -10%, #1c2b5a, var(--bg));
        color: var(--text);
      }

      header {
        padding: 20px 16px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        backdrop-filter: blur(10px);
        background: rgba(11, 16, 32, 0.75);
        z-index: 10;
      }

      header h1 {
        margin: 0 0 6px 0;
        font-size: 18px;
      }

      input[type="text"],
      input[type="file"],
      textarea {
        width: 100%;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        outline: none;
      }

      textarea {
        min-height: 140px;
        font-family: var(--mono);
        font-size: 12px;
      }

      .wrap {
        padding: 16px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 12px;
        align-items: start;
      }

      .card {
        grid-column: span 12;
        background: rgba(17, 26, 51, 0.72);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
      }

      @media (min-width: 900px) {
        .col-6 {
          grid-column: span 6;
        }
      }

      .card h2 {
        font-size: 14px;
        margin: 0 0 8px 0;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      button {
        cursor: pointer;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 10px;
        font-weight: 600;
      }

      button.primary {
        border-color: rgba(110, 168, 254, 0.35);
        background: rgba(110, 168, 254, 0.12);
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .row > * {
        flex: 1;
        min-width: 180px;
      }

      pre {
        margin: 0;
        padding: 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border);
        overflow: auto;
        font-family: var(--mono);
        font-size: 12px;
      }

      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        margin-left: 8px;
      }

      .status.ok {
        color: var(--ok);
      }
      .status.bad {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Test AI Module</h1>
        <div class="row">
          <div style="min-width: 260px; flex: 2">
            <label class="muted">Base URL</label>
            <input id="baseUrl" type="text" value="http://localhost:3000" />
          </div>
          <div style="min-width: 260px; flex: 2">
            <label class="muted">Prefix AI</label>
            <input id="aiPrefix" type="text" value="/ai" />
          </div>
          <div style="min-width: 260px; flex: 2">
            <label class="muted">Prefix Upload</label>
            <input id="uploadPrefix" type="text" value="/upload" />
          </div>
          <div style="min-width: 260px; flex: 2">
            <label class="muted">Status</label>
            <div id="statusLine" class="muted">Ready</div>
          </div>
          <div style="min-width: 160px; flex: 1; align-self: end">
            <button class="primary" id="pingBtn">Ping /</button>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="grid">
        <section class="card col-6">
          <h2>Upload PDF <span class="pill">POST /upload/pdf</span></h2>
          <div class="row">
            <div>
              <label class="muted">File PDF</label>
              <input id="pdfFile" type="file" accept="application/pdf" />
            </div>
          </div>
          <div style="margin-top: 10px" class="row">
            <button class="primary" id="uploadPdfBtn">Upload</button>
          </div>
          <div class="muted" style="margin-top: 10px">
            Setelah upload sukses, endpoint <code>/ai/ask</code> akan memakai dokumen terakhir yang diupload.
          </div>
        </section>

        <section class="card col-6">
          <h2>Ask AI <span class="pill">POST /ai/ask</span></h2>
          <div>
            <label class="muted">Body (JSON)</label>
            <textarea id="askBody"></textarea>
          </div>
          <div style="margin-top: 10px" class="row">
            <button class="primary" id="askBtn">Ask</button>
            <button id="askExampleBtn">Load Example</button>
          </div>
          <div class="muted" style="margin-top: 10px">
            Jika belum ada dokumen: error <code>Belum ada dokumen diupload</code>.
          </div>
        </section>

        <section class="card col-12">
          <h2>Response Log</h2>
          <pre id="log"></pre>
        </section>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      const statusLine = $("statusLine");

      const setStatus = (text, ok = true) => {
        statusLine.textContent = text;
        statusLine.className = ok ? "muted status ok" : "muted status bad";
      };

      const buildUrl = (path) => {
        const base = $("baseUrl").value.trim().replace(/\/+$/, "");
        return `${base}${path.startsWith("/") ? "" : "/"}${path}`;
      };

      const writeLog = (payload) => {
        logEl.textContent = typeof payload === "string" ? payload : JSON.stringify(payload, null, 2);
      };

      const safeJsonParse = (raw) => {
        try {
          return { ok: true, value: JSON.parse(raw) };
        } catch (e) {
          return { ok: false, error: e.message };
        }
      };

      const requestJson = async ({ method, path, body }) => {
        const url = buildUrl(path);
        setStatus(`${method} ${url} ...`);

        const headers = {};
        if (body !== undefined) headers["content-type"] = "application/json";

        const res = await fetch(url, {
          method,
          headers,
          body: body !== undefined ? JSON.stringify(body) : undefined,
        });

        const text = await res.text();
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }

        writeLog({ status: res.status, ok: res.ok, url, data });
        setStatus(`${method} ${url} -> ${res.status}`, res.ok);
        return { res, data };
      };

      const requestMultipart = async ({ path, file, fieldName }) => {
        const url = buildUrl(path);
        setStatus(`POST ${url} (multipart) ...`);

        const form = new FormData();
        form.append(fieldName, file);

        const res = await fetch(url, { method: "POST", body: form });
        const text = await res.text();
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }

        writeLog({ status: res.status, ok: res.ok, url, data });
        setStatus(`POST ${url} -> ${res.status}`, res.ok);
        return { res, data };
      };

      const loadAskExample = () => {
        $("askBody").value = JSON.stringify(
          { question: "Ringkas isi dokumen yang terakhir diupload." },
          null,
          2
        );
      };

      loadAskExample();

      $("askExampleBtn").addEventListener("click", loadAskExample);

      $("pingBtn").addEventListener("click", async () => {
        await requestJson({ method: "GET", path: "/" });
      });

      $("uploadPdfBtn").addEventListener("click", async () => {
        const uploadPrefix = $("uploadPrefix").value.trim() || "/upload";
        const file = $("pdfFile").files?.[0];
        if (!file) return writeLog({ error: "Pilih file PDF dulu" });
        await requestMultipart({ path: `${uploadPrefix}/pdf`, file, fieldName: "file" });
      });

      $("askBtn").addEventListener("click", async () => {
        const aiPrefix = $("aiPrefix").value.trim() || "/ai";
        const parsed = safeJsonParse($("askBody").value);
        if (!parsed.ok) return writeLog({ error: parsed.error });
        await requestJson({ method: "POST", path: `${aiPrefix}/ask`, body: parsed.value });
      });
    </script>
  </body>
</html>
